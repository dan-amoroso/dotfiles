# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[mode.main.binding]
alt-enter = '''exec-and-forget open -n -a Ghostty.app'''
# See: https://nikitabobko.github.io/AeroSpace/goodness#open-a-new-window-with-applescript
# alt-enter = '''exec-and-forget osascript -e '
# set appName to "WezTerm"
#
# if application appName is running then
#   Do Shell Script "/Applications/WezTerm.app/Contents/MacOS/wezterm-gui"
# else
#   tell application appName to activate
# end if'
# '''

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-f = 'fullscreen'

alt-s = 'layout v_accordion' # 'layout stacking' in i3
alt-w = 'layout h_accordion' # 'layout tabbed' in i3
alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3

alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

# Not supported, because this command is redundant in AeroSpace mental model.
# See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
#alt-space = 'focus toggle_tiling_floating'

# `focus parent`/`focus child` are not yet supported, and it's not clear whether they
# should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
# alt-a = 'focus parent'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

alt-shift-c = 'reload-config'

alt-r = 'mode resize'
alt-shift-esc = 'mode vim'

[mode.vim.binding]
alt-shift-esc = 'mode main'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

[workspace-to-monitor-force-assignment]
10 = '^built-in retina display$'

# TERMINAL go to 1

[[on-window-detected]]
if.app-id='com.github.wez.wezterm'
run = 'move-node-to-workspace 1'

# Personal browsers go to 2

[[on-window-detected]]
if.app-id='org.mozilla.com.zen.browser'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id='company.thebrowser.Browser'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id='com.brave.Browser'
run = 'move-node-to-workspace 3'

# ORG apps go to 9

[[on-window-detected]]
if.app-id='com.apple.iCal'
run = 'move-node-to-workspace 8'

# COMMS apps go to 0

[[on-window-detected]]
if.app-id='com.apple.MobileSMS'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id='org.whispersystems.signal-desktop'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-id='com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id='com.1password.1password'
run = 'layout floating'
