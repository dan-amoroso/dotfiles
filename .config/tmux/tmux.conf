set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g allow-passthrough on
set -g focus-events on
set -g mouse on
set -g default-terminal "tmux-256color"

# Enable cursor blinking
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -g cursor-style blinking-block
set -g cursor-colour "#7aa2f7"


# leader r reloads config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# undbind standard prefix
unbind C-b
# set prefix to backtick
set -g prefix `

# Vim style pane selection - removed in favor of vim-tmux-navigator
# Use C-h/j/k/l (without prefix) for seamless navigation between vim and tmux

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'samoshkin/tmux-plugin-sysstat'

# Disable wrapping when navigating at edges
set -g @vim_navigator_no_wrap 1

# Make active pane more visible with distinct border colors
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

# Flash the active pane briefly when switching (visual feedback)
set -g display-panes-time 1000
set -g display-panes-colour '#3b4261'
set -g display-panes-active-colour '#7aa2f7'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha" # latte, frappe, macchiato, or mocha
set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, or none

# Override window text to show window name instead of pane title
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"

# # Allow automatic window renaming
# set-window-option -g automatic-rename on
# set-option -g allow-rename on

run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

source-file ~/.config/tmux/plugins/tmux/status/sysstat.conf


# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Make the status line pretty and add some modules

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_sysstat}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

set-window-option -g window-size latest
# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
